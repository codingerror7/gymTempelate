<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS GYM WEBSITE</title>
    <style>
        body{
            background: url('https://cdn.pixabay.com/photo/2016/11/22/22/24/adult-1850925_1280.jpg');
            height: 900px;
            color: white;
           
            
        }
        .left{ 
            display: inline-block;
            position: absolute;
            left: 20px;
            top: 10px;

        }
        .left img{
            width: 80px;
            filter: invert(100%);

        }

        .mid{
            display: block;
            width: 600px;
            margin: 30px auto;
            font-family: Arial, Helvetica, sans-serif;
        }
        .navbar li{
            display: inline;
            padding: 17px;
          

        }

        .navbar li:hover{
            color: grey;
        }

        .right{
            display: inline-block;
            position: absolute;
            right: 34px;
            top: 20px;
            
        }
        .btn{
            background-color: rgb(0, 0, 0);
            color: white;
            border-radius: 10px;
            padding: 10px;
            margin: 0px;
        }
        .btn:hover{
            color: grey;
        }
        .container{
            border: solid rgb(255, 255, 255);
            border-radius: 40px;
            width: 300px;
            margin: 160px 1080px;
            padding: 50px;
            text-align: center;
            font-family: 'Times New Roman', Times, serif;

        }
        input{
            border: solid white;
            border-radius: 20px;
            margin: 5px;
            padding: 5px;
            text-align: center;
            width: 300px;

        }
        .btnone{
            margin: 12px;
            padding: 4px;
            border-radius: 12px;
            width: 100px;
        }
        .btnone:hover{
            color: grey;
        }
        hr{
            width: 700px;
        }
       
        

    </style>
</head>
<body>
    <header>
    <div class="left">
       <img src="https://i.pinimg.com/736x/42/9d/63/429d631659a11a9eb666b103d811470a.jpg" alt="">
      
    </div>
    <div class="mid">
        <ul class="navbar">
            <li>HOME</li>
            <li>ABOUT</li>
            <li>SERVICES</li>
            <li>FITNESS-CALCULATOR</li>
            
        </ul>
    </div>
    <div class="right">
        <button class="btn"> CALL US NOW</button>
        <button class="btn">EMAIL US</button>
    </div>
    </header>
    <hr>
    <div class="container">
        <h2>JOIN THE BEST GYM OF BHOPAL:</h2>
        <div class="text">
        <form>
            <div class="text">
            <input type="text" name="" placeholder="Enter Your Name"><br>
            <input type="text" name="" placeholder="Enter Your Age"><br>
            <input type="text" name="" placeholder="Enter Your Number"><br>
            <input type="text" name="" placeholder="Enter Your Email">
            </div> 
            <button class="btnone">SUBMIT</button>
        </form>
        </div>
    </div>

    
</body>
</html>
